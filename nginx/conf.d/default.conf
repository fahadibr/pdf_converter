limit_req_zone $binary_remote_addr zone=convert_rate:10m rate=10r/m;
limit_conn_zone $server_name zone=convert_concurrent:10m;

resolver 127.0.0.11 ipv6=off valid=10s;

upstream pdf_forge_app {
    zone pdf_forge_app 64k;
    server app:3000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Trust forwarded client addresses only from private network ranges. On AWS,
    # restrict the EC2 security group to the ALB security group as well.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 26m;
    client_body_timeout 20s;
    send_timeout 65s;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;

    location = /api/convert {
        limit_req zone=convert_rate burst=3 nodelay;
        limit_req_status 429;
        limit_conn convert_concurrent 3;
        limit_conn_status 429;
        proxy_pass http://pdf_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ^~ /_next/static/ {
        proxy_pass http://pdf_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://pdf_forge_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
